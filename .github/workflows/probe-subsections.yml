name: probe-subsections

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run probe
        run: npm run probe

      - name: Open PR with probed subsections
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/probe-subsections
          commit-message: "chore: probe rules subsection links"
          title: "chore: probe rules subsection links"
          body: |
            Output of the rules-subsection probe (`scripts/probe-subsections.js`).

            Lists every `?…` link found on https://www.swcombine.com/rules/ along with its display label. The lazy-fetch routing in `api/chat.js` consumes this file to map a user's question to a specific sub-page URL.
          labels: automated, rules-subsections
          add-paths: src/data/rules-subsections.json

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsSL -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ probe-subsections failed. See $RUN_URL\"}" \
            "$WEBHOOK"
